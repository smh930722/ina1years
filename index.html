<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>이나 돌잔치 초대장 고르기</title>
<style>
:root{--bg:#f3f4f1;--surface:#fff;--fg:#1d2320;--muted:#66706a;--line:#dadfd8}
@media (prefers-color-scheme:dark){:root{--bg:#131615;--surface:#1b1f1d;--fg:#e6eae6;--muted:#98a29a;--line:#2b312e;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 'Malgun Gothic',system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:48px 20px}
h1{font-size:28px;margin:0 0 8px}
p{color:var(--muted);margin:0 0 28px}
a.card{display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:12px;color:inherit;text-decoration:none}
a.card b{display:block;font-size:18px;margin-bottom:4px}
a.card span{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>이나 돌잔치 초대장 고르기</h1>
  <p>마음에 드는 걸 ♥로 찜하고, 목록을 복사해서 서로 보내 주세요.</p>
  <a class="card" href="styles/examples.html"><b>실제 초대장 예시 82개</b><span>국내 9개 업체 샘플. 누르면 샘플 초대장이 바로 열려요</span></a>
  <a class="card" href="styles/index.html"><b>스타일 아이디어 118가지</b><span>방향을 잡기 위해 새로 그려 본 스타일 카탈로그</span></a>
</div>
</body>
</html>
